name: 💡 Feature / Lesson Request
description: Suggest a new lesson, example, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for wanting to make CppCodeExample more useful!
        Note: This is **not** a place to report bugs — please use the Bug Report template.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is missing or hard to understand right now?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should be added or changed?
      placeholder: "Add a lesson 12_SmartPointers covering unique_ptr and shared_ptr."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and pull requests for this idea.
          required: true
        - label: I am willing to submit a pull request for this (optional).
          required: false
